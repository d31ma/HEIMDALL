<header class="flex items-center justify-between gap-4 py-4 px-[clamp(1rem,4vw,2.5rem)] sticky top-0 z-10 border-b border-[var(--w-border,#e3e3e3)] bg-[color-mix(in_srgb,var(--w-surface,#fff)_82%,transparent)] backdrop-blur-md">
  <a class="site-link flex items-center gap-2.5 no-underline" href="/">
    <img src="/shared/assets/heimdall-mark.svg" class="w-8 h-8" alt="" aria-hidden="true">
    <strong class="text-[1.05rem] tracking-wide">HEIMDALL</strong>
  </a>
  <nav class="flex items-center gap-5 max-sm:gap-3 text-[0.95rem]">
    <a class="site-link site-nav-link max-sm:hidden" href="/#features">Features</a>
    <a class="site-link site-nav-link max-sm:hidden" href="/#security">Security</a>
    <a class="site-link site-nav-link" href="/docs">Docs</a>
    <!-- Both icons are markup, not strings in a script: the toggle shows the
         one for the theme a press would switch to, and JS only sets which. -->
    <button class="site-link site-nav-link site-theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
      <svg data-theme-icon="dark" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg data-theme-icon="light" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true" hidden>
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>

    <a class="w-btn w-btn-filled w-btn-primary w-btn--sm" href="/docs">Get started</a>
  </nav>

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # HEIMDALL's tests run against real compiled binaries, never fakes. An
  # authorization test against a stub would happily return "allow" and prove
  # nothing. These versions are pinned together and upgraded together.
  SESAME_VERSION: v26.33.02
  FYLO_VERSION: v26.33.02
  # Pinned like the pair above — and CHEX's install.sh treats its version
  # env verbatim, so "latest" builds a vlatest URL and 404s.
  CHEX_VERSION: v26.32.02
  TTID_VERSION: v26.32.03
  # sops and age back the sops/ secret scheme end-to-end tests, installed
  # through the Go module proxy so the checksum database pins them.
  SOPS_MODULE: github.com/getsops/sops/v3/cmd/sops@v3.9.4
  AGE_MODULE: filippo.io/age/cmd/...@v1.2.1

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        # Pinned to the commit TACHYON's CI verified, not a movable tag.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true

      - name: Install FYLO, SESAME, CHEX, and TTID
        run: scripts/install-deps.sh --control-plane

      - name: Install sops and age for the secret-scheme tests
        # Without these the SOPS end-to-end tests skip silently, and a CI
        # that skips the flagship secrets path is not testing it.
        run: |
          go install "$SOPS_MODULE"
          go install "$AGE_MODULE"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l app/server tests/server)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: scripts/native-go.sh vet

      - name: Test with a coverage floor
        # -coverpkg makes coverage cross-package, so a handler exercised only
        # through the reconcile tests still counts. The floor is a ratchet:
        # measured 63.5% when set, floored at 60 — raise it when it rises,
        # never lower it to make a build pass.
        run: |
          scripts/native-go.sh test -count=1 -coverprofile="$GITHUB_WORKSPACE/coverage.out" -coverpkg="$(scripts/native-go.sh packages | paste -sd, -)"
          total=$(go -C app/server tool cover -func="$GITHUB_WORKSPACE/coverage.out" | tail -1 | grep -oE '[0-9.]+' | tail -1)
          echo "coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 60.0) ? 0 : 1 }' || {
            echo "coverage ${total}% is below the 60% floor" >&2
            exit 1
          }

      - name: Refuse skipped binary-backed suites
        # The suites skip politely when a binary is missing, which is right
        # locally and wrong here: CI exists to run them. A skip on the
        # runner means the install step regressed.
        run: |
          output=$(scripts/native-go.sh test-packages -count=1 -v ./repositories/store/ ./services/auth/ ./services/reconcile/ ./services/registry/ 2>&1 | grep -c "SKIP" || true)
          if [ "$output" -gt 0 ]; then
            echo "$output test(s) skipped; a required binary is missing from PATH" >&2
            exit 1
          fi

      - name: Verify heimdall version ships
        run: |
          go -C app/server build -ldflags "-X main.version=$(cat VERSION)" -o "$GITHUB_WORKSPACE/heimdall" ./commands/heimdall
          ./heimdall version
          test "$(./heimdall version)" = "heimdall $(cat VERSION)"

  gates:
    name: Standing gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run the CI gates
        run: scripts/ci-gates.sh

  web:
    name: Qualified web, gateway, and website gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Configure only after a native Linux/amd64 checkpoint >=29 is qualified
      # (including an explicitly scoped qualification with its base provenance).
      # Pin the manifest independently; its artifact hash and source are verified
      # before ty executes. A macOS artifact or an old release tag is insufficient.
      HD_TACHYON_BINARY_URL: ${{ vars.TACHYON_LINUX_AMD64_BINARY_URL }}
      HD_TACHYON_MANIFEST_URL: ${{ vars.TACHYON_LINUX_AMD64_MANIFEST_URL }}
      HD_TACHYON_MANIFEST_SHA256: ${{ vars.TACHYON_LINUX_AMD64_MANIFEST_SHA256 }}
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Require the native Linux qualification handoff
        shell: bash
        run: |
          export HD_TACHYON_BIN="$RUNNER_TEMP/heimdall-qualified-input/ty"
          export HD_TACHYON_MANIFEST="$RUNNER_TEMP/heimdall-qualified-input/manifest.json"
          export DEPS_BIN="$RUNNER_TEMP/heimdall-deps/bin"
          printf '%s\n' "HD_TACHYON_BIN=$HD_TACHYON_BIN" "HD_TACHYON_MANIFEST=$HD_TACHYON_MANIFEST" "DEPS_BIN=$DEPS_BIN" "HD_TEST_COMPILER=$DEPS_BIN/ty" "HD_E2E_TACHYON_BIN=$DEPS_BIN/ty" "HD_E2E_COMPILER_MANIFEST=$HD_TACHYON_MANIFEST" "HD_E2E_WORK_ROOT=$RUNNER_TEMP" "HD_E2E_EVIDENCE_DIR=$RUNNER_TEMP/heimdall-e2e-evidence" >> "$GITHUB_ENV"
          if [ -z "$HD_TACHYON_BINARY_URL" ] || [ -z "$HD_TACHYON_MANIFEST_URL" ] || [ -z "$HD_TACHYON_MANIFEST_SHA256" ]; then
            echo 'Blocked: no qualified Linux/amd64 Tachyon checkpoint >=29 handoff. Configure TACHYON_LINUX_AMD64_BINARY_URL, TACHYON_LINUX_AMD64_MANIFEST_URL, and TACHYON_LINUX_AMD64_MANIFEST_SHA256 after qualification.' >&2
            exit 1
          fi
          case "$HD_TACHYON_BINARY_URL" in https://*) ;; *) echo 'Compiler URL must use HTTPS.' >&2; exit 1;; esac
          case "$HD_TACHYON_MANIFEST_URL" in https://*) ;; *) echo 'Manifest URL must use HTTPS.' >&2; exit 1;; esac
          [[ "$HD_TACHYON_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Pin the exact manifest SHA256.' >&2; exit 1; }
          mkdir -p "$(dirname "$HD_TACHYON_BIN")"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 "$HD_TACHYON_MANIFEST_URL" -o "$HD_TACHYON_MANIFEST"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 180 "$HD_TACHYON_BINARY_URL" -o "$HD_TACHYON_BIN"
          scripts/install-deps.sh --tachyon

      - name: Set up the Yon Go toolchain
        # The control-plane matrix still follows go.mod. Yon requires local
        # Go >=1.27; its assembler deliberately disables automatic downloads.
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install the pinned control-plane dependencies
        run: scripts/install-deps.sh --control-plane

      - name: Install locked web tools and browser
        run: |
          npm ci --prefix app
          # The website intentionally shares the exact web lockfile/tools.
          # This link is created only in the disposable CI checkout.
          ln -s "$GITHUB_WORKSPACE/app/node_modules" website/node_modules
          "$GITHUB_WORKSPACE/app/node_modules/.bin/playwright" install --with-deps chromium-headless-shell

      - name: Check plain JavaScript tests and configuration
        # Authored @Service/@OnStart JavaScript is compiler input. The qualified
        # bundle below parses it; Node's parser does not understand decorators.
        run: |
          find tests/app -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          node --check app/playwright.config.js

      - name: Vendor DuVay
        run: scripts/vendor-duvay.sh

      - name: Compile the app and website with the qualified compiler
        # These bundles also create the global model declarations consumed by
        # checkJs. All generated files remain in the disposable CI checkout.
        run: |
          ty bundle "$GITHUB_WORKSPACE/app" --out-dir dist --no-incremental
          ty bundle "$GITHUB_WORKSPACE/website" --out-dir dist --no-incremental

      - name: Run the actual Yon gateway tests
        # These tests compile and serve the Go BFF with HD_TEST_COMPILER.
        run: npm test --prefix app

      - name: Type-check both clients
        run: |
          npm run typecheck --prefix app
          npm run typecheck --prefix appsite

      - name: Check the committed Tailwind sheets are fresh
        run: |
          npm run css --prefix app
          npm run css --prefix appsite
          if ! git diff --exit-code -- app/client/shared/styles/tailwind.css website/client/shared/styles/tailwind.css; then
            echo 'The committed Tailwind sheets are stale; regenerate both with the locked web dependencies.' >&2
            exit 1
          fi

      - name: Check the vendored asset is not committed
        run: |
          for dir in app/client/shared/assets/duvay website/client/shared/assets/duvay; do
            if [ -n "$(git ls-files "$dir")" ]; then
              echo "$dir is committed; it should be vendored by script" >&2
              exit 1
            fi
          done

      - name: Run isolated web end-to-end fixtures
        env:
          HD_E2E_NODE_MODULES: ${{ github.workspace }}/app/node_modules
        run: scripts/e2e-web.sh

      - name: Serve the compiled website and run its suite
        shell: bash
        run: |
          python3 - <<'PY_SITE'
          import os,pathlib,signal,socket,subprocess,time,urllib.error,urllib.request
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          with socket.socket() as reservation:
              reservation.bind(('127.0.0.1',0));port=reservation.getsockname()[1]
          url='http://127.0.0.1:'+str(port)
          def stop_owned(process):
              try:os.killpg(process.pid,signal.SIGCONT);os.killpg(process.pid,signal.SIGTERM)
              except ProcessLookupError:pass
              try:process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  try:os.killpg(process.pid,signal.SIGKILL)
                  except ProcessLookupError:pass
                  process.wait()
          def interrupted(_signal,_frame):raise SystemExit(143)
          signal.signal(signal.SIGTERM,interrupted)
          signal.signal(signal.SIGINT,interrupted)
          log=pathlib.Path(os.environ['RUNNER_TEMP'])/'heimdall-website.log'
          with log.open('wb') as output:
              process=subprocess.Popen([os.environ['HD_TEST_COMPILER'],'serve',str(root/'website'),'--host','127.0.0.1','--port',str(port),'--out-dir','dist','--no-bundle','--no-watch','--no-self-restart'],cwd=root/'website',stdout=output,stderr=subprocess.STDOUT,start_new_session=True)
              try:
                  ready=False
                  for _ in range(30):
                      if process.poll() is not None:raise SystemExit('Owned website runtime exited before readiness; see '+str(log))
                      try:
                          with urllib.request.urlopen(url,timeout=1) as response:ready=response.status==200
                      except (OSError,urllib.error.URLError):pass
                      if ready:break
                      time.sleep(1)
                  if not ready:raise SystemExit('Owned website runtime did not become ready; see '+str(log))
                  environment=os.environ.copy();environment['SITE_URL']=url
                  browser=subprocess.Popen([str(root/'app/node_modules/.bin/playwright'),'test',r'site\.spec\.js$','--workers','1','--retries','0'],cwd=root/'app',env=environment,start_new_session=True)
                  try:raise SystemExit(browser.wait(timeout=360))
                  finally:stop_owned(browser)
              finally:stop_owned(process)
          PY_SITE

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum

      - name: golangci-lint
        # v8 installs the v2 line; v6's v1 binaries are built with go1.24
        # and refuse a go1.26 toolchain directive.
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: app/server
          args: --config ../../.golangci.yml ./commands/... ./services/api/... ./helpers/git/... ./helpers/schema/... ./helpers/secrets/... ./utils/... ./models/spec/... ./repositories/... ./services/agent/... ./services/auth/... ./services/dispatch/... ./services/enroll/... ./services/observe/... ./services/provider/... ./services/reconcile/... ./services/registry/... ./services/render/...

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum

      - name: Scan for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd app/server
          govulncheck ./commands/... ./services/api/... ./helpers/git/... ./helpers/schema/... ./helpers/secrets/... ./utils/... ./models/spec/... ./repositories/... ./services/agent/... ./services/auth/... ./services/dispatch/... ./services/enroll/... ./services/observe/... ./services/provider/... ./services/reconcile/... ./services/registry/... ./services/render/...

  licenses:
    name: License scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum

      - name: Check dependency licences
        # Apache-2.0 is HEIMDALL's own licence; the allowlist is the set
        # compatible with redistributing a single binary under it.
        run: |
          go install github.com/google/go-licenses@latest
          cd app/server
          go-licenses check ./commands/... ./services/api/... ./helpers/git/... ./helpers/schema/... ./helpers/secrets/... ./utils/... ./models/spec/... ./repositories/... ./services/agent/... ./services/auth/... ./services/dispatch/... ./services/enroll/... ./services/observe/... ./services/provider/... ./services/reconcile/... ./services/registry/... ./services/render/... \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC

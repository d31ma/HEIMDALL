# Release: tag v* → binaries for every platform, checksums, provenance.
#
# Plain `go build` rather than a release tool: five platforms is a for-loop,
# and every dependency in a release pipeline is something a supply-chain
# attack can arrive through. Provenance comes from GitHub's native artifact
# attestation, which binds each binary to the exact commit and workflow that
# built it — verifiable with `gh attestation verify`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation
  attestations: write  # store it

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify the tag matches VERSION
        # A tag that disagrees with the committed VERSION file would ship a
        # binary that reports a different version than its release page.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match VERSION $version" >&2
            exit 1
          fi

      - name: Install FYLO, SESAME, and CHEX
        # Without the real binaries the binary-backed suites skip, and a
        # release gate that skips them proves nothing.
        run: scripts/install-deps.sh
        env:
          SESAME_VERSION: v26.33.02
          FYLO_VERSION: v26.33.02

      - name: Run the tests and gates first
        # A release is not a place to discover the build is broken.
        run: |
          go vet ./...
          go test -count=1 ./...
          scripts/ci-gates.sh

      - name: Build every platform
        run: |
          mkdir -p dist
          version="$(cat VERSION)"
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${platform%/*}"; arch="${platform#*/}"
            output="dist/heimdall_${version}_${os}_${arch}"
            [ "$os" = "windows" ] && output="${output}.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "$output" ./cmd/heimdall
          done

      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt

      - name: Attest provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/heimdall_*

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "heimdall ${GITHUB_REF_NAME}" \
            --notes "Binaries are attested; verify with:
          \`\`\`
          gh attestation verify heimdall_$(cat VERSION)_<os>_<arch> --repo ${GITHUB_REPOSITORY}
          \`\`\`
          Checksums in \`checksums.txt\`. See CHANGELOG.md for what changed."
